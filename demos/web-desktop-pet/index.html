<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Control · 桌面宠物</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">C</span><strong>CONTROL</strong><span class="divider"></span><span>桌面宠物</span></div>
    <span class="local-badge"><i></i>本地演示</span>
  </header>
  <div class="workspace">
    <aside class="settings" aria-label="数字人设置">
      <div class="section-heading"><h1>陪伴空间</h1><span class="version">01</span></div>
      <section class="settings-section preview-section">
        <div class="label-row">
          <h2 id="preview-heading">台词与动作</h2>
          <select id="preview-tag" aria-label="插入动作标签" title="插入动作标签">
            <option value="">动作标签</option>
            <option value="[摇头]">摇头</option><option value="[点头]">点头</option>
            <option value="[微笑]">微笑</option><option value="[惊讶]">惊讶</option>
            <option value="[向左看]">向左看</option><option value="[向右看]">向右看</option>
            <option value="[H:none]">头部静止</option>
          </select>
        </div>
        <textarea id="preview-text" rows="3" maxlength="160" aria-labelledby="preview-heading" spellcheck="false">[摇头][微笑]你好，很高兴见到你。今天过得怎么样？</textarea>
        <div class="speech-controls preview-controls">
          <button id="preview-play" class="primary-button" disabled aria-pressed="false"><span class="icon" aria-hidden="true">&#xe672;</span><span id="preview-label">静音预览</span></button>
          <button id="preview-stop" class="icon-button" aria-label="停止静音预览" title="停止或取消生成"><span class="stop-symbol" aria-hidden="true"></span></button>
          <output id="preview-time" aria-label="静音预览进度">0.0 s</output>
        </div>
        <p id="preview-status" class="speech-status" role="status" data-state="idle">待预览</p>
      </section>
      <section class="settings-section">
        <h2>数字人</h2>
        <div class="model-row"><span class="model-monogram">B</span><div><strong>本地形象</strong><small>原始 LAM 资源</small></div><span id="model-status" class="status">加载中</span></div>
        <dl class="metadata"><div><dt>形象格式</dt><dd>ZIP / GLB / PLY</dd></div><div><dt>口型来源</dt><dd>原始 TAR / PyTorch</dd></div></dl>
      </section>
      <section class="settings-section speech-section">
        <div class="label-row"><h2>语音试听</h2><span class="tag">EN / 中文字幕</span></div>
        <div class="speech-controls">
          <button id="speech-play" class="primary-button" disabled aria-pressed="false"><span class="icon" aria-hidden="true">&#xe684;</span><span id="speech-label">开口说话</span></button>
          <button id="speech-stop" class="icon-button" aria-label="停止语音" title="停止语音"><span class="stop-symbol" aria-hidden="true"></span></button>
          <output id="speech-time" aria-label="语音进度">0:00</output>
        </div>
        <p id="speech-status" class="speech-status" role="status">等待形象</p>
        <div class="label-row"><label for="expression">表情预设</label><select id="expression"><option value="natural">自然</option><option value="smile">微笑</option><option value="surprise">惊讶</option><option value="focus">专注</option></select></div>
        <label class="toggle-row" for="postprocess"><span>Control 后处理</span><input id="postprocess" type="checkbox" role="switch" checked></label>
        <audio id="speech-audio" preload="none"></audio>
      </section>
      <section class="settings-section">
        <div class="label-row"><label for="size">显示尺寸</label><output id="size-value" for="size">300 px</output></div>
        <input id="size" type="range" min="180" max="380" step="10" value="300">
        <label class="toggle-row" for="captions"><span>字幕</span><input id="captions" type="checkbox" role="switch" checked></label>
        <label class="toggle-row" for="loop"><span>字幕循环</span><input id="loop" type="checkbox" role="switch"></label>
      </section>
      <section class="settings-section">
        <div class="label-row"><label for="script">演示台词</label><span class="tag">纯字幕</span></div>
        <textarea id="script" rows="5" maxlength="1000">你好，很高兴见到你。
今天也一起，把重要的事情慢慢做好吧。
忙碌的时候，别忘了休息片刻。</textarea>
        <div class="playback-row"><button id="play" class="primary-button"><span class="icon" aria-hidden="true">&#xe672;</span><span id="play-label">播放台词</span></button><span id="playback-status" role="status">待播放</span></div>
      </section>
      <section class="settings-section bottom-actions">
        <button id="reset" class="plain-button"><span class="icon" aria-hidden="true">&#xe6bf;</span>重置位置</button>
        <button id="visibility" class="plain-button"><span class="icon" aria-hidden="true">&#xe66f;</span><span id="visibility-label">收起数字人</span></button>
      </section>
    </aside>
    <main class="desk">
      <div class="desk-heading"><div><p class="eyebrow">PERSONAL WORKSPACE</p><h2>我的工作台</h2></div><span class="date">日常 · 便笺</span></div>
      <div class="note-heading"><h3>今天的安排</h3><span class="tag pink">个人</span></div>
      <div class="checklist">
        <label><input type="checkbox" checked><span>整理今天的想法</span></label>
        <label><input type="checkbox"><span>留一点时间，专注手边的事情</span></label>
        <label><input type="checkbox"><span>休息一下，喝杯水</span></label>
      </div>
      <label class="note-label" for="note">随手记</label>
      <textarea id="note" class="note" aria-label="随手记" placeholder="此刻，想记下什么？"></textarea>
      <div class="desk-footer"><span>CONTROL LAB</span><span>本地会话</span></div>
    </main>
  </div>
  <section id="pet" class="pet" aria-label="悬浮数字人">
    <div class="caption-slot"><div id="caption-bubble" class="caption-bubble"><span id="caption-label" class="caption-label">演示字幕</span><p id="caption" role="status" aria-live="polite">你好，很高兴见到你。</p></div></div>
    <div class="avatar-view">
      <iframe id="avatar" src="/avatar.html" title="透明数字人画面" tabindex="-1" aria-hidden="true"></iframe>
      <button id="drag-surface" class="drag-surface" aria-label="拖动数字人" title="拖动数字人；方向键移动，Enter 切换台词"></button>
      <div id="loading" class="loading" role="status"><span id="loading-text">正在加载形象…</span><button id="retry" class="plain-button" hidden>重新加载</button></div>
    </div>
    <div class="pet-toolbar">
      <span class="pet-name"><i></i>Control</span>
      <button id="next-caption" class="icon-button" aria-label="下一句演示字幕" title="下一句演示字幕"><span class="icon" aria-hidden="true">&#xe697;</span></button>
      <button id="pet-reset" class="icon-button" aria-label="重置位置" title="重置位置"><span class="icon" aria-hidden="true">&#xe6bf;</span></button>
      <button id="collapse" class="icon-button" aria-label="收起数字人" title="收起数字人"><span class="icon" aria-hidden="true">&#xe66f;</span></button>
    </div>
  </section>
  <button id="restore" class="restore" hidden aria-label="恢复数字人" title="恢复数字人"><span class="icon" aria-hidden="true">&#xe697;</span></button>
  <script type="module" src="/src/host.mjs"></script>
</body>
</html>
